[project]
name = "hmj"
version = "0.1.0"
description = "Human-Machine Judgment runtime CLI."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "judgment-core",
  "judgment-sdk",
  "judgment-storage-sqlite",
  "judgment-mcp",
  "click>=8.0",
  "fastapi>=0.115",
  "uvicorn>=0.34",
  "tomli-w>=1.0",
  "pyyaml>=6.0",
]

[project.scripts]
hmj = "hmj.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hmj"]

[tool.uv.sources]
judgment-core = { workspace = true }
judgment-sdk = { workspace = true }
judgment-storage-sqlite = { workspace = true }
judgment-mcp = { workspace = true }
