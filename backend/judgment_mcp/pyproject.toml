[project]
name = "judgment-mcp"
version = "0.1.0"
description = "MCP server exposing Judgment Points as resources and tools for the Model Context Protocol."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "judgment-core",
  "judgment-sdk",
  "mcp>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/judgment_mcp"]

[tool.uv.sources]
judgment-core = { workspace = true }
judgment-sdk = { workspace = true }
