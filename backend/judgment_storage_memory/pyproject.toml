[project]
name = "judgment-storage-memory"
version = "0.1.0"
description = "In-memory storage adapter implementing the JudgmentStorage interface."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["judgment-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/judgment_storage_memory"]

[tool.uv.sources]
judgment-core = { workspace = true }
