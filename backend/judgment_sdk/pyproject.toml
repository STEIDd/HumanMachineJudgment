[project]
name = "judgment-sdk"
version = "0.1.0"
description = "Developer SDK providing typed interfaces for creating, querying, resolving, and managing Judgment Points programmatically."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["judgment-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/judgment_sdk"]

[tool.uv.sources]
judgment-core = { workspace = true }
