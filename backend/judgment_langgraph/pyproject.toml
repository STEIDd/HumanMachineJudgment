[project]
name = "judgment-langgraph"
version = "0.1.0"
description = "LangGraph adapter for durable Judgment Point interrupts, checkpointing, and workflow resumption."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "judgment-core",
  "judgment-sdk",
  "langgraph>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/judgment_langgraph"]

[tool.uv.sources]
judgment-core = { workspace = true }
judgment-sdk = { workspace = true }
