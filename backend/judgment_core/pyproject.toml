[project]
name = "judgment-core"
version = "0.1.0"
description = "Core domain types, state machine, lifecycle guards, materiality scoring, policy evaluation, authority, events, and projection for Judgment Points."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["pydantic>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/judgment_core"]
