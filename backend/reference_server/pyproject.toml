[project]
name = "reference-server"
version = "0.1.0"
description = "Reference HTTP API server for Judgment Points, built with FastAPI."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "judgment-core",
  "judgment-sdk",
  "judgment-storage-memory",
  "fastapi>=0.115",
  "uvicorn>=0.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reference_server"]

[tool.uv.sources]
judgment-core = { workspace = true }
judgment-sdk = { workspace = true }
judgment-storage-memory = { workspace = true }
