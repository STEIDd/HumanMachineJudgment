[project]
name = "judgment-storage-sqlite"
version = "0.1.0"
description = "SQLite storage adapter for persistent storage of Judgment Points and events."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "judgment-core",
  "sqlalchemy>=2.0",
  "aiosqlite>=0.20",
  "alembic>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/judgment_storage_sqlite"]

[tool.uv.sources]
judgment-core = { workspace = true }
