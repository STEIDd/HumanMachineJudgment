name: Feature Request
description: Suggest a new feature or capability.
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Use this template to propose a new feature or capability for the project.

        Before submitting, search existing issues to check whether a similar request has already been filed.

  - type: textarea
    id: description
    attributes:
      label: Feature Description
      description: A clear description of the feature you are proposing.
      placeholder: Describe the feature and what it would do.
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: Explain the problem this feature would solve or the workflow it would support. Include concrete examples if possible.
      placeholder: |
        What are you trying to accomplish?
        How would this feature fit into your workflow?
        What alternatives have you considered or tried?
    validations:
      required: true

  - type: checkboxes
    id: packages
    attributes:
      label: Affected Packages
      description: Select the packages this feature would involve or affect.
      options:
        - label: judgment-core
        - label: judgment-schemas
        - label: judgment-sdk
        - label: judgment-mcp
        - label: judgment-langgraph
        - label: judgment-storage-memory
        - label: judgment-storage-sqlite
        - label: judgment-ui
        - label: reference-demo
        - label: reference-server
        - label: documentation
        - label: schemas (standalone)
        - label: evals
        - label: skills
        - label: Other / New package

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any other information, mockups, references, or examples that help explain the feature request.
    validations:
      required: false
